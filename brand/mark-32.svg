<!-- rbadillap arc mark — 32px variant (favicon geometry).
     Small sizes recalibrate strokes (1.5 baseline / 1.75 arc) so the
     mark stays legible. Must match src/app/icon.svg. Fixed colors
     because favicons cannot inherit currentColor. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#fafaf8"/>
  <line x1="2" y1="20" x2="30" y2="20" stroke="#18181b" stroke-width="1.5"/>
  <path d="M 9.5 20 A 6.5 6.5 0 0 1 22.5 20" fill="none" stroke="#18181b" stroke-width="1.75"/>
  <circle cx="9.5" cy="20" r="1.6" fill="#18181b"/>
  <circle cx="22.5" cy="20" r="1.6" fill="#18181b"/>
  <circle cx="16" cy="13.5" r="1.1" fill="#18181b"/>
</svg>
